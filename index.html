<style>
  :root {
    --purple: #5b169b;
    --purple-dark: #3d0e6b;
    --yellow: #faf050;
    --gold: #e8d04c;
    --ink: #1a1a1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--purple);
    background: linear-gradient(180deg, var(--purple) 0%, var(--purple-dark) 100%);
    background-attachment: fixed;
    color: var(--yellow);
    min-height: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .screen {
    display: none;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 560px;
    margin: 0 auto;
  }
  .screen.active { display: block; }

  /* ---------- Home ---------- */
  .header { text-align: center; padding-bottom: 24px; }

  .logo {
    width: 150px;
    height: 150px;
    display: block;
    margin: 0 auto 14px;
    border-radius: 50%;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    line-height: 1.15;
  }
  h1 span {
    display: block;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.15rem;
    letter-spacing: .22em;
    margin-top: 4px;
  }

  /* ---------- Tiles ---------- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  .tile {
    display: block;
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    color: var(--yellow);
    text-align: center;
    cursor: pointer;
  }
  .tile img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border: 4px solid var(--gold);
    border-radius: 18px;
    box-shadow: 0 6px 0 rgba(0, 0, 0, .28);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .tile:active img { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .28); }
  .tile:focus-visible { outline: 3px solid #fff; outline-offset: 4px; border-radius: 18px; }
  .tile-name {
    display: block;
    margin-top: 10px;
    font-size: 1rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  /* ---------- Inner pages ---------- */
  .back {
    background: none;
    border: 2px solid var(--yellow);
    color: var(--yellow);
    font: inherit;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .back:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .page-title {
    font-size: 1.6rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
    margin: 24px 0 16px;
  }

  .full-image {
    display: block;
    width: 100%;
    height: auto;
    border: 4px solid var(--gold);
    border-radius: 18px;
  }

  .save {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 16px;
    background: var(--yellow);
    color: var(--ink);
    border: 4px solid var(--gold);
    border-radius: 14px;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0, 0, 0, .28);
  }
  .save:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .28); }
  .save:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .hint { margin-top: 14px; text-align: center; font-size: .9rem; opacity: .85; }
</style>
</head>

  <button class="save" data-save="found-dog-img" data-filename="found-dog.jpg">Save to device</button>
  <p class="hint">You can also press and hold the image to save it.</p>
</section>

<script>
  // Simple screen switcher: any element with data-go="id" shows that screen.
  function show(id) {
    var target = document.getElementById(id) || document.getElementById('home');
    document.querySelectorAll('.screen').forEach(function (s) {
      s.classList.toggle('active', s === target);
    });
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-go]');
    if (!el) return;
    var id = el.getAttribute('data-go');
    location.hash = id === 'home' ? '' : id;
  });

  // Save button: on phones this opens the share sheet (with "Save Image");
  // elsewhere it downloads the file.
  document.addEventListener('click', async function (e) {
    var btn = e.target.closest('[data-save]');
    if (!btn) return;
    var img = document.getElementById(btn.getAttribute('data-save'));
    var name = btn.getAttribute('data-filename') || 'image.jpg';
    try {
      var blob = await (await fetch(img.src)).blob();
      var file = new File([blob], name, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return; // user closed the share sheet
    }
    var a = document.createElement('a');
    a.href = img.src;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  // Tiles reuse the picture from their full-size page, so each image is only stored once.
  document.querySelectorAll('img[data-from]').forEach(function (img) {
    img.src = document.getElementById(img.getAttribute('data-from')).src;
  });

  window.addEventListener('hashchange', function () { show(location.hash.slice(1) || 'home'); });
  show(location.hash.slice(1) || 'home');
</script>
